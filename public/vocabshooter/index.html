<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Shooter</title>
<link rel="icon" href="../vocabmountain/apple-touch-icon.png">
<link rel="apple-touch-icon" href="../vocabmountain/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Vocab Shooter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
:root{--panel:rgba(24,19,46,.8);--line:rgba(255,255,255,.14);--muted:#cdc6e0;--accent:#ff9f43;--good:#4ade80;--bad:#ff5d73;--display:"Chakra Petch",Ubuntu,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#15122e;color:#fff;font:15px/1.5 Ubuntu,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
/* darkened screen corners, and the red flash when an orb hits you */
#vig,#hurt{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(18,8,34,.5) 100%)}
#hurt{opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,45,85,.65) 100%)}
#hurt.hit{animation:hurt .5s ease-out}
@keyframes hurt{from{opacity:1}to{opacity:0}}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,16,40,.15)}
.panel{width:100%;max-width:560px;max-height:100%;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;padding:26px 24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{margin:0;font:700 36px/1.1 var(--display);text-align:center;text-transform:uppercase;letter-spacing:.03em}
h1 span{color:var(--accent)}
.sub{margin:6px 0 0;text-align:center;color:var(--muted)}
.total{margin:18px 0 0;text-align:center;font-weight:700}
.btn{display:block;width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.06);font:700 16px/1.4 var(--display);letter-spacing:.02em;text-align:center}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1530}
.btn.primary:hover{background:#ffb368}
.title{display:block;margin:18px 0 8px;font-weight:700}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.g{padding:6px 4px 5px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05);font-size:12px;color:var(--muted)}
.g:hover{background:rgba(255,255,255,.12)}
.g b{display:block;color:#fff;font:700 17px/1.3 var(--display)}
.bar{display:block;height:4px;margin:5px 2px 3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.sens{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;margin-top:18px;font-weight:600}
.sens output{color:var(--accent)}
.sens input{width:100%;margin:0;accent-color:var(--accent)}
.hint{margin:16px 0 0;text-align:center;color:var(--muted);font-size:12px}
.hint a{color:inherit}
#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 150px;pointer-events:none}
#prompt{max-width:100%;padding:6px 24px 7px;border:1px solid var(--line);border-bottom:2px solid var(--accent);border-radius:14px;background:var(--panel);text-align:center}
.label{color:var(--accent);font:700 11px/1.5 var(--display);letter-spacing:.16em;text-transform:uppercase}
#word{font:700 32px/1.15 var(--display);overflow-wrap:anywhere}
#meta{color:var(--muted);font-size:13px}
#turn{display:none;padding:3px 10px;border-radius:8px;background:var(--panel);color:var(--muted);font-size:12px}
@media (orientation:portrait) and (pointer:coarse){#turn{display:block}}
#quit,#mute,#clock{position:fixed;top:12px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
#quit{left:12px}
#mute{right:12px}
#clock{right:66px;min-width:76px;padding:4px 12px;font:700 22px/30px var(--display);font-variant-numeric:tabular-nums;text-align:center}
#clock.low{border-color:var(--bad);color:var(--bad)}
#clock.hit{animation:clockhit .6s}
#clock::after{content:"−5s";position:absolute;left:0;right:0;top:100%;color:var(--bad);font-size:18px;opacity:0}  /* matches ORB_COST */
#clock.hit::after{animation:penalty .9s ease-out}
@keyframes clockhit{from{transform:scale(1.3);color:var(--bad)}to{transform:none}}
@keyframes penalty{from{opacity:1}to{opacity:0;transform:translateY(18px)}}
/* crosshair: four ticks and a dot; snaps to a red X on a hit */
#cross{--c:#fff;position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;pointer-events:none;transition:transform .08s;background:radial-gradient(circle,var(--c) 0 1.5px,transparent 2px);filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000)}
#cross::before,#cross::after{content:"";position:absolute}
#cross::before{left:12px;top:0;width:2px;height:26px;background:linear-gradient(var(--c) 0 8px,transparent 8px 18px,var(--c) 18px)}
#cross::after{left:0;top:12px;width:26px;height:2px;background:linear-gradient(90deg,var(--c) 0 8px,transparent 8px 18px,var(--c) 18px)}
#cross.hit{--c:#ff5252;transform:rotate(45deg) scale(1.3)}
#lost{position:fixed;left:50%;top:calc(50% + 34px);transform:translateX(-50%);padding:4px 12px;border-radius:8px;background:var(--panel);font-size:13px;pointer-events:none}
#card{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:calc(100% - 32px);max-width:560px;max-height:60vh;overflow:auto;padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none}
.touch #card{pointer-events:auto}
.verdict{margin:0;font-weight:700}
.verdict.good{color:var(--good)}
.verdict.bad{color:var(--bad)}
#card h2{margin:2px 0 0;font:700 28px/1.2 var(--display)}
.say{margin:0 0 6px;color:var(--muted);font-size:16px;letter-spacing:.03em}  /* how to say the word; capitals are the stressed syllable */
.def{margin:8px 0 0;padding:9px 12px;border:1px solid transparent;border-radius:10px;background:rgba(255,255,255,.05)}
.def.asked{border-color:rgba(255,159,67,.4);background:rgba(255,159,67,.14)}
.def p{margin:0}
.def .syn{margin-top:3px;color:var(--accent);font-size:13px}
.def .ex{margin-top:3px;color:var(--muted);font-size:14px;font-style:italic}
.score{margin:10px 0 0;text-align:center;font:700 48px/1.2 var(--display)}
.miss{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.05);font-size:14px}
.miss b{color:var(--accent)}
/* phone controls */
#joy{position:fixed;left:0;top:0;width:110px;height:110px;margin:-55px;border:2px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.55)}
.tbtn{position:fixed;border:2px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(24,19,46,.55);font:700 15px var(--display);letter-spacing:.06em;touch-action:none}
.tbtn:active{background:rgba(255,159,67,.6)}
#fire{right:calc(20px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:84px;height:84px;border-color:var(--accent)}
#jump{right:calc(118px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:60px;height:60px;font-size:12px}
@media (max-width:600px){
  #hud{padding:58px 12px 0}
  #word{font-size:25px}
  h1{font-size:28px}
  .panel{padding:22px 16px}
  #card{bottom:12px;width:calc(100% - 24px);padding:12px 14px}
}
/* phones held sideways are short: keep the word box and card compact */
@media (max-height:500px){
  #hud{padding:8px 150px}
  .label{display:none}
  #word{font-size:22px}
  #card{max-width:460px;max-height:70vh;bottom:8px}
  #card h2{font-size:20px}
  .say{font-size:14px}
  .def .ex{display:none}
}
</style>
</head>
<body>
<div id="vig"></div>
<div id="hurt"></div>
<div id="hud" hidden><div id="prompt"><div class="label">Shoot the meaning of</div><div id="word"></div><div id="meta"></div></div><div id="turn">Turn your phone sideways to see all four signs</div></div>
<div id="cross" hidden></div>
<div id="lost" hidden>↻ Look around for the signs</div>
<button id="quit" hidden>‹ Groups</button>
<div id="clock" hidden></div>
<button id="mute" aria-label="Toggle sound"></button>
<div id="joy" hidden><div id="knob"></div></div>
<button id="jump" class="tbtn" hidden>JUMP</button>
<button id="fire" class="tbtn" hidden>FIRE</button>
<div id="card" hidden></div>
<div id="menu" class="overlay"><div class="panel"><h1>Vocab <span>Shooter</span></h1><p class="sub">Loading words…</p></div></div>
<div id="pause" class="overlay" hidden><div class="panel"><h1>Paused</h1>
  <button class="btn primary" data-act="resume">Resume</button><button class="btn" data-act="quit">All groups</button>
  <label class="sens">Look sensitivity <output></output><input type="range" min="0.2" max="3" step="0.1" data-sens></label></div></div>
<div id="done" class="overlay" hidden><div class="panel"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const pick = a => a[Math.random() * a.length | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = THREE.MathUtils.clamp;
// same inputs -> same number: repeatable scenery, and jittered vertices shared by two faces stay joined
const hash = (...v) => { const s = Math.sin(v.reduce((a, x, i) => a + Math.round(x * 10) * [12.9898, 78.233, 37.719][i], 0)) * 43758.5453; return s - Math.floor(s); };
const fmt = s => `${s / 60 | 0}:${String(s % 60).padStart(2, '0')}`;
const SESSION = 10, CLOCK = 180;                      // words per session, seconds on the clock
const ORB_SPEED = 8, ORB_COST = 5;                    // turret orbs: units per second, seconds lost per hit
const ASPECT = 2.4, SW = 5, SH = SW / ASPECT;         // sign size
const EYE = 1.6, R = .4, HGT = 1.75, STEP = .35;      // player body
const SPEED = 9, JUMP = 8.5, GRAV = 24, LOOK = .0022; // movement feel
const ARENA = 36;                                     // half-width of the arena floor
const touch = matchMedia('(pointer:coarse)').matches;
document.body.classList.toggle('touch', touch);
const cross = $('#cross'), clockEl = $('#clock');

// ---------- progress, kept in this browser ----------
const KEY = 'vocabshooter';
const S = {learned: new Set(), missed: new Set(), muted: false, sens: 1};
try { const o = JSON.parse(localStorage.getItem(KEY)); if (o) { S.learned = new Set(o.learned); S.missed = new Set(o.missed); S.muted = !!o.muted; S.sens = +o.sens || 1; } } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({learned: [...S.learned], missed: [...S.missed], muted: S.muted, sens: S.sens})); } catch {} };

// ---------- sound: synthesized, no files ----------
let ac;
const audio = () => { ac ??= new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; };
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (S.muted) return;
  const a = audio(), t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (S.muted) return;
  const a = audio(), b = a.createBuffer(1, a.sampleRate * dur | 0, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  pew: () => { tone(900, 140, .12, 'square', .05); noise(.08, .4, 3000); },
  good: () => { noise(.4, .9, 2600); tone(660, 660, .3, 'sine', .14, .06); tone(990, 990, .45, 'sine', .11, .16); },
  bad: () => { noise(.4, .9, 700); tone(220, 90, .4, 'triangle', .18); },
  orb: () => tone(260, 170, .2, 'sine', .06),
  hurt: () => { noise(.3, .9, 1400); tone(420, 90, .3, 'sawtooth', .1); },
};

// ---------- renderer ----------
let renderer;
try { renderer = new THREE.WebGLRenderer({antialias: true}); }
catch (e) { $('#menu .sub').textContent = 'This game needs WebGL, which is turned off in this browser.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement, MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
const canvas2d = (w, h) => { const cv = Object.assign(document.createElement('canvas'), {width: w, height: h}); return [cv, cv.getContext('2d')]; };
const texture = (cv, repeat) => { const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO; if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; };

// ---------- sky and light: a low sun ahead and to the right of where you spawn ----------
const scene = new THREE.Scene();
const SUN = new THREE.Vector3(.55, .42, -.72).normalize(), SUN_AZ = Math.atan2(SUN.x, -SUN.z);
const SKY = {hor: new THREE.Color(0xf7a072), rose: new THREE.Color(0xc65f7f), violet: new THREE.Color(0x4a3470), top: new THREE.Color(0x15122e)};
scene.fog = new THREE.Fog(SKY.hor, 90, 560);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, .05, 1300);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xd4c4ff, 0xb08a7a, 1.25));
const fill = new THREE.DirectionalLight(0xff9fc0, .9);  // rose light from opposite the sun, so faces in shadow keep their colour
fill.position.set(-SUN.x, .5, -SUN.z); scene.add(fill);
const sunLight = new THREE.DirectionalLight(0xffb27a, 2.6);
sunLight.position.copy(SUN).multiplyScalar(90);
sunLight.castShadow = true;
sunLight.shadow.mapSize.setScalar(touch ? 1024 : 2048);
Object.assign(sunLight.shadow.camera, {left: -54, right: 54, top: 30, bottom: -26, near: 30, far: 150});  // just covers the arena as seen from the sun
sunLight.shadow.camera.updateProjectionMatrix();
sunLight.shadow.bias = -.0004; sunLight.shadow.normalBias = .04;
scene.add(sunLight);

const sky = new THREE.Mesh(new THREE.SphereGeometry(650, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {sun: {value: SUN}, hor: {value: SKY.hor}, rose: {value: SKY.rose}, violet: {value: SKY.violet}, top: {value: SKY.top}},
  vertexShader: `varying vec3 v; void main() { v = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform vec3 sun, hor, rose, violet, top; varying vec3 v;
    void main() {
      vec3 d = normalize(v); float h = max(d.y, 0.), s = max(dot(d, sun), 0.);
      vec3 c = mix(hor, rose, smoothstep(0., .2, h));
      c = mix(c, violet, smoothstep(.12, .5, h));
      c = mix(c, top, smoothstep(.4, .95, h));
      c += vec3(1., .55, .25) * pow(s, 5.) * .6;                    // wide warm glow
      c += vec3(1., .8, .55) * pow(s, 80.) * 1.5;                   // halo
      c += vec3(1., .95, .85) * smoothstep(.9990, .9996, s) * 6.;   // the sun itself
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
scene.add(sky);
const starPos = [];
for (let i = 0; i < 350; i++) { const a = hash(i, 11) * Math.PI * 2, y = .45 + hash(i, 12) * .55, r = Math.sqrt(1 - y * y); starPos.push(Math.cos(a) * r * 600, y * 600, Math.sin(a) * r * 600); }
sky.add(new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3)),
  new THREE.PointsMaterial({color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: .7, fog: false, depthWrite: false})));
// clouds glow pink from below, as they do at sunset; no fog so they stay bright against the sky
const cloudG = new THREE.IcosahedronGeometry(1, 1), cloudM = new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xff8fa3, emissiveIntensity: .5, flatShading: true, roughness: 1, fog: false});
const clouds = [];
for (let k = 0; k < 14; k++) {
  const cl = new THREE.Group(), a = hash(k, 21) * Math.PI * 2, dist = 240 + hash(k, 22) * 220;
  for (let j = 0; j < 5; j++) {
    const puff = new THREE.Mesh(cloudG, cloudM), s = (16 + hash(k, j, 23) * 14) * (1 - Math.abs(j - 2) * .22);  // biggest in the middle
    puff.position.set((j - 2) * 17 + hash(k, j, 24) * 6, hash(k, j, 25) * 5, hash(k, j, 26) * 12); puff.scale.set(s, s * .42, s * .75);
    cl.add(puff);
  }
  cl.position.set(Math.sin(a) * dist, 95 + hash(k, 27) * 80, Math.cos(a) * dist); cl.rotation.y = hash(k, 28) * 6;
  scene.add(cl); clouds.push(cl);
}

// ---------- valley around the mesa ----------
function faceColors(geo, colorOf) {  // non-indexed geometry: one flat colour per triangle
  const p = geo.attributes.position, out = [];
  for (let i = 0; i < p.count; i += 3) { const col = colorOf((p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3, i); for (let k = 0; k < 3; k++) out.push(col.r, col.g, col.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(out, 3)); geo.computeVertexNormals(); return geo;
}
const flat = new THREE.MeshStandardMaterial({vertexColors: true, flatShading: true});
const SNOW = new THREE.Color(0xfff4ec), ROCK = [0x6c5b7b, 0x5b4b6e, 0x7a6283].map(h => new THREE.Color(h));
for (let k = 0; k < 22; k++) {  // a ring of peaks
  const a = k / 22 * Math.PI * 2 + hash(k, 5) * .2, dist = 260 + hash(k, 4) * 160;
  const underSun = Math.abs(Math.atan2(Math.sin(a - SUN_AZ), Math.cos(a - SUN_AZ))) < .45;  // keep these low so the sun isn't hidden
  const r = 50 + hash(k, 1) * 60, h = (70 + hash(k, 2) * 100) * (underSun ? .55 : 1);
  const g = new THREE.ConeGeometry(r, h, 7, 4), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const X = p.getX(i), Y = p.getY(i), Z = p.getZ(i);
    if (Y > h / 2 - .01) continue;  // keep the peak sharp
    const n = hash(X, Y, Z) - .5;
    p.setXYZ(i, X * (1 + n * .4), Y + n * h * .06, Z * (1 + n * .4));
  }
  const m = new THREE.Mesh(faceColors(g.toNonIndexed(), (y, i) => (y + h / 2) / h > .68 ? SNOW : ROCK[hash(i, k) * 3 | 0]), flat);
  m.position.set(Math.sin(a) * dist, h / 2 - 9, -Math.cos(a) * dist); scene.add(m);
}
const GREEN = [0x3f6e55, 0x4a7a5a, 0x36614e].map(h => new THREE.Color(h));
const gg = new THREE.PlaneGeometry(1400, 1400, 70, 70).rotateX(-Math.PI / 2), gp = gg.attributes.position;
for (let i = 0; i < gp.count; i++) { const X = gp.getX(i), Z = gp.getZ(i); gp.setY(i, (hash(X, Z) - .5) * (1 + Math.hypot(X, Z) * .015)); }
const valley = new THREE.Mesh(faceColors(gg.toNonIndexed(), (y, i) => GREEN[hash(i) * 3 | 0]), flat);
valley.position.y = -9; scene.add(valley);
const leafG = new THREE.ConeGeometry(1.8, 5.5, 6), trunkG = new THREE.CylinderGeometry(.3, .4, 1.6, 5);
const leafM = new THREE.MeshStandardMaterial({color: 0x24513f, flatShading: true}), trunkM = new THREE.MeshStandardMaterial({color: 0x5a3d2b, flatShading: true});
for (let k = 0; k < 90; k++) {
  const a = hash(k, 7) * Math.PI * 2, dist = 55 + hash(k, 8) * 120, tree = new THREE.Group();
  const leaf = new THREE.Mesh(leafG, leafM), trunk = new THREE.Mesh(trunkG, trunkM);
  leaf.position.y = 4.2; trunk.position.y = .8;
  tree.add(leaf, trunk); tree.scale.setScalar(.7 + hash(k, 9) * .8); tree.position.set(Math.sin(a) * dist, -9.3, Math.cos(a) * dist); scene.add(tree);
}

// ---------- glow ----------
// ponytail: additive sprites stand in for a bloom pass; switch to EffectComposer + UnrealBloomPass if real bloom is wanted

  shatter(signs[i], point, ok);
  signs.forEach((s, k) => {
    if (k === i) return;
    if (k === right) s.userData.glow = s.userData.halo.visible = true;
    s.userData.front.material.color.set(k === right ? 0xbaf7d0 : 0x77748a);
  });
  if (ok) { score++; S.learned.add(w); S.missed.delete(w); sfx.good(); }
  else { S.missed.add(w); S.learned.delete(w); misses.push(q); sfx.bad(); }
  save();
  setTimeout(() => showCard(q, ok), 380);
}
function showCard(q, ok) {
  if (phase !== 'card') return;  // quit during the shatter
  cardAt = clock.elapsedTime;
  $('#card').innerHTML = `<p class="verdict ${ok ? 'good' : 'bad'}">${ok ? 'Nice shot!' : 'Missed. This word will come back.'}</p>
    <h2>${esc(q.w.word)}</h2>
    <p class="say">${esc(q.w.say || '')}</p>
    ${q.w.defs.map(d => `<div class="def${d === q.d ? ' asked' : ''}"><p>${esc(d.def)}</p>
      ${d.syns.length ? `<p class="syn">${d.syns.map(esc).join(' · ')}</p>` : ''}
      ${d.example ? `<p class="ex">“${esc(d.example)}”</p>` : ''}</div>`).join('')}
    ${touch ? `<button class="btn primary" data-act="next">${at === quiz.length - 1 ? 'See results' : 'Next word'} ›</button>`
            : `<p class="hint">Clock stopped. Click or press E for the ${at === quiz.length - 1 ? 'results' : 'next word'}</p>`}`;
  $('#card').hidden = false; $('#card').scrollTop = 0;
}
function next() {
  if (phase !== 'card' || clock.elapsedTime - cardAt < .4) return;  // a stray double-click shouldn't skip the card
  $('#card').hidden = true;
  ++at < quiz.length ? ask() : finish();
}
function groupStats() {
  const st = {};
  WORDS.forEach(w => { const s = st[w.group] ??= {n: 0, done: 0}; s.n++; if (S.learned.has(w.word)) s.done++; });
  return st;
}
function hideAll() {
  clearSigns(); clearOrbs(); paused = false;
  ['#menu', '#done', '#pause', '#hud', '#quit', '#clock', '#card', '#cross', '#lost', '#fire', '#jump', '#joy'].forEach(s => $(s).hidden = true);
}
function finish(timedOut) {
  hideAll(); phase = 'done'; document.exitPointerLock?.();
  const st = groupStats()[group];
  $('#done .panel').innerHTML = `<h1>${timedOut ? 'Time’s up!' : score === quiz.length ? 'Clean sweep!' : 'Session done'}</h1>
    <div class="score">${score} / ${quiz.length}</div>
    <p class="sub">${timedOut ? 'Out of time' : fmt(Math.ceil(timeLeft)) + ' left on the clock'} · Group ${group}: ${st.done} / ${st.n} learned</p>
    ${misses.length ? `<span class="title">Coming back next time</span>${misses.map(q => `<div class="miss"><b>${esc(q.w.word)}</b>: ${esc(q.answer)}</div>`).join('')}` : ''}
    <button class="btn primary" data-act="again">Next ${SESSION} words ›</button>
    <button class="btn" data-act="quit">All groups</button>`;
  $('#done').hidden = false;
}
function menu() {
  hideAll(); phase = 'menu'; document.exitPointerLock?.();
  const st = groupStats(), groups = Object.keys(st).map(Number), up = groups.find(g => st[g].done < st[g].n) ?? groups[0];
  $('#menu .panel').innerHTML = `<h1>Vocab <span>Shooter</span></h1>
    <p class="sub">Shoot the sign that gives each word’s meaning.<br>
    ${SESSION} words, ${fmt(CLOCK)} on the clock. Keep moving: the lamps fire slow orbs, and each hit costs ${ORB_COST} seconds.</p>
    <p class="total">${groups.reduce((a, g) => a + st[g].done, 0)} / ${WORDS.length} words learned</p>
    <button class="btn primary" data-g="${up}">Play Group ${up} ›</button>
    <span class="title">Or pick a group</span>
    <div class="groups">${groups.map(g => `<button class="g" data-g="${g}"><b>${g}</b><span class="bar"><i style="width:${st[g].done / st[g].n * 100}%"></i></span>${st[g].done}/${st[g].n}</button>`).join('')}</div>
    <label class="sens">Look sensitivity <output></output><input type="range" min="0.2" max="3" step="0.1" data-sens></label>
    <p class="hint">${touch ? 'Left thumb moves, right thumb looks. Tap FIRE, or tap a sign to shoot it. Best played sideways.'
                            : 'WASD to move, mouse to aim, click to shoot. Hold Space to hop. Esc pauses.'}<br>
    Words from <a href="https://www.gregmat.com/" target="_blank" rel="noreferrer">GregMAT</a> · <a href="../vocabmountain/">Vocab Mountain quiz</a></p>`;
  paintSens();
  $('#menu').hidden = false;
}
// playing is a history entry, so the phone's back swipe returns to the groups instead of leaving the page
function play(g) { history.pushState({play: 1}, ''); startSession(g); }
function quit() { history.state?.play ? history.back() : menu(); }
addEventListener('popstate', () => { if (phase !== 'menu') menu(); });

// ---------- input: desktop ----------
function lockPointer() { if (!touch) try { canvas.requestPointerLock()?.catch?.(() => {}); } catch {} }
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  paused = !locked && playing();  // Esc releases the mouse: pause until they click back in
  $('#pause').hidden = !paused;
  if (paused) keys.clear();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-g],[data-act]');
  if (!b) return;
  if (b.dataset.g) return play(+b.dataset.g);
  ({next, quit, again: () => startSession(group), resume: lockPointer})[b.dataset.act]();
});
$('#quit').onclick = quit;
const mute = $('#mute'), paintMute = () => mute.textContent = S.muted ? '🔇' : '🔊';
mute.onclick = () => { S.muted = !S.muted; save(); paintMute(); mute.blur(); };
paintMute();
addEventListener('keydown', e => {
  if (!playing() || paused) return;
  if (e.code === 'Space') e.preventDefault();
  keys.add(e.code);
  if (e.code === 'KeyE' || e.code === 'Enter') next();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const aimAt = (x, y) => { ndc.set(x / innerWidth * 2 - 1, 1 - y / innerHeight * 2); ray.setFromCamera(ndc, camera); return ray; };
const centre = () => { ndc.set(0, 0); ray.setFromCamera(ndc, camera); return ray; };
const look = (dx, dy, k) => { k *= S.sens; yaw -= dx * k; pitch = clamp(pitch - dy * k, -1.5, 1.5); };
// the sensitivity slider lives on the menu and the pause screen; both stay in sync
const paintSens = () => document.querySelectorAll('[data-sens]').forEach(el => { el.value = S.sens; el.previousElementSibling.textContent = S.sens.toFixed(1) + '×'; });
document.addEventListener('input', e => { if (e.target.dataset.sens !== undefined) { S.sens = +e.target.value; save(); paintSens(); } });
paintSens();

// ---------- input: mouse and touch on the canvas ----------
const joy = {id: null, ox: 0, oy: 0, x: 0, y: 0}, drag = {id: null, x: 0, y: 0, sx: 0, sy: 0, t: 0};
canvas.addEventListener('pointerdown', e => {
  if (!playing()) return;
  if (e.pointerType === 'mouse') {
    if (e.button) return;
    if (!locked) return lockPointer();
    return phase === 'card' ? next() : trigger(centre());
  }
  if (e.clientX < innerWidth * .4 && joy.id === null) {  // left side: a joystick appears under the thumb
    Object.assign(joy, {id: e.pointerId, ox: e.clientX, oy: e.clientY, x: 0, y: 0});
    $('#joy').style.transform = `translate(${e.clientX}px,${e.clientY}px)`; $('#knob').style.transform = ''; $('#joy').hidden = false;
  } else if (drag.id === null) Object.assign(drag, {id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: e.timeStamp});
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { if (locked && !paused) look(e.movementX, e.movementY, LOOK); return; }
  if (e.pointerId === joy.id) {
    const dx = clamp(e.clientX - joy.ox, -50, 50), dy = clamp(e.clientY - joy.oy, -50, 50);
    joy.x = dx / 50; joy.y = dy / 50; $('#knob').style.transform = `translate(${dx}px,${dy}px)`;
  } else if (e.pointerId === drag.id) { look(e.clientX - drag.x, e.clientY - drag.y, .006); drag.x = e.clientX; drag.y = e.clientY; }
});
const release = e => {
  if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; $('#joy').hidden = true; }
  if (e.pointerId === drag.id) {
    drag.id = null;  // a quick tap without dragging shoots whatever is under the finger (event times, so a slow frame can't turn a tap into a hold)
    if (e.type === 'pointerup' && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 12 && e.timeStamp - drag.t < 300) phase === 'card' ? next() : trigger(aimAt(e.clientX, e.clientY));
  }
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
const hold = (el, down, up) => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, up));
};
hold($('#fire'), () => phase === 'card' ? next() : trigger(centre()), () => {});
hold($('#jump'), () => jumpHeld = true, () => jumpHeld = false);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- frame loop ----------
const easeBack = x => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
const frustum = new THREE.Frustum(), pv = new THREE.Matrix4();
let unseen = 0, frames = 0, frameSum = 0, cheap = false;
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), dt = Math.min(raw, .05), t = clock.elapsedTime;
  // slow device: if 90 frames in a row average under 25 fps, drop shadows and render at lower resolution, once.
  // (25, not 30: phones in low-power mode cap at 30 fps and shouldn't lose their shadows for it)
  if (!cheap && t > 3 && raw < .25 && (frameSum += raw, ++frames === 90)) {
    if (frameSum / 90 > .04) { cheap = true; sunLight.castShadow = false; renderer.setPixelRatio(1); }
    frames = frameSum = 0;
  }
  let moving = false;
  if (playing()) {
    if (!paused) moving = movePlayer(dt);
    if (phase === 'aim' && !paused) danger(dt);
    camera.position.set(P.x, P.y + EYE, P.z);
    camera.rotation.set(pitch + (Math.random() - .5) * shake * .06, yaw + (Math.random() - .5) * shake * .06, 0);  // shakes when an orb lands
    shake = Math.max(0, shake - dt * 4);
  } else {  // behind the menus: a slow orbit above the arena
    camera.position.set(Math.sin(t * .05) * 50, 17, Math.cos(t * .05) * 50); camera.lookAt(0, 2, 0);
  }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  clouds.forEach(c => { c.position.x += dt * .6; if (c.position.x > 430) c.position.x = -430; });

  gun.visible = playing();
  bob += moving ? dt * 11 : 0;
  gun.position.set(GUN_AT.x + Math.cos(bob) * .012, GUN_AT.y + Math.abs(Math.sin(bob)) * .02 - (grounded ? 0 : .03), GUN_AT.z + recoil * .08);
  gun.rotation.x = recoil * .15;
  flash.scale.setScalar(.001 + recoil * .5); flash.material.opacity = recoil;
  recoil = Math.max(0, recoil - dt * 8); tip.scale.setScalar(1 + recoil * 1.5);
  tracerT -= dt; tracer.visible = tracerT > 0; tracer.material.opacity = Math.max(0, tracerT / .1);

  signs.forEach(s => {
    const u = s.userData;
    s.scale.setScalar(Math.max(.001, easeBack(clamp((t - u.born) / .45, 0, 1))) * (u.glow ? 1 + .04 * Math.sin(t * 8) : 1));
    s.rotation.y = Math.atan2(P.x - s.position.x, P.z - s.position.z);  // always face the player
    u.halo.material.opacity = .55 + .25 * Math.sin(t * 8);
  });
  // nudge them if every sign is off-screen for a moment
  pv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); frustum.setFromProjectionMatrix(pv);
  unseen = phase === 'aim' && !signs.some(s => s.visible && frustum.containsPoint(s.position)) ? unseen + dt : 0;
  $('#lost').hidden = unseen < 1.2;

  shards = shards.filter(m => {
    const u = m.userData; u.life += dt;
    if (u.life > 1.3) { scene.remove(m); return false; }
    u.v.y -= 14 * dt; m.position.addScaledVector(u.v, dt);
    m.rotation.x += u.spin.x * dt; m.rotation.y += u.spin.y * dt;
    m.scale.setScalar(1 - (u.life / 1.3) ** 2);
    return true;
  });
  bursts = bursts.filter(s => {
    const u = s.userData, k = (u.life += dt) / .35;
    if (k >= 1) { scene.remove(s); s.material.dispose(); return false; }
    s.scale.setScalar(u.size * (.3 + k)); s.material.opacity = 1 - k;
    return true;
  });
  for (let i = 0; i < MOTES; i++) {
    mp[i * 3] += Math.sin(t + i) * dt * .15; mp[i * 3 + 1] += dt * .3;
    if (mp[i * 3 + 1] > 14) mp[i * 3 + 1] = 0;
  }
  motes.geometry.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
});

// pron.json: how to say each word, in plain letters with the stressed syllable in capitals. The game still runs if it fails to load.
Promise.all([fetch('../vocabmountain/vocab.json').then(r => r.json()), fetch('pron.json').then(r => r.json()).catch(() => ({}))]).then(([rows, pron]) => {
  WORDS = rows.map(([word, group, defs]) => ({word, group, say: pron[word], defs: defs.map(([def, syns, example]) => ({def, syns, example}))}));
  history.replaceState(null, '');  // a reload starts at the groups screen
  menu();
}).catch(() => { $('#menu .sub').textContent = 'Could not load the word list.'; });
</script>
</body>
</html>
